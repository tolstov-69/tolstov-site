<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Толстов Олександр Леонідович | Хірург-флеболог</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#eef3f8;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
}

.banner{
    position:relative;
    width:100%;
    max-width:720px;
}

.banner img{
    width:100%;
    display:block;
}

/* Велика кнопка "Запишіться на консультацію" */
.book{
    position:absolute;
    left:7%;
    top:67%;
    width:60%;
    height:6.5%;
    border-radius:20px;
}

/* Великий телефон */
}

/* Велика адреса */
.map{
    position:absolute;
    left:31%;
    top:95.8%;
    width:50%;
    height:3%;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    font-size:18px;
    color:#14345d;
    text-decoration:none;
}

/* QR-код */
.qr{
    position:absolute;
    right:3%;
    top:88.5%;
    width:19%;
    height:10%;
}

/* Пульсація кнопки */
.book::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:20px;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%{
        box-shadow:0 0 0 0 rgba(10,132,255,.45);
    }
    70%{
        box-shadow:0 0 0 18px rgba(10,132,255,0);
    }
    100%{
        box-shadow:0 0 0 0 rgba(10,132,255,0);
    }
}

@media (max-width:480px){

.phone{
    font-size:24px;
}

.map{
    font-size:15px;
}

}
</style>
</head>

<body>

<div class="banner">

<img src="banner.jpg" alt="Хірург-флеболог">

<!-- Запис на консультацію -->
<a class="book" href="tel:+380689523823" title="Записатися на консультацію"></a>

</a>

<!-- Адреса -->
<a class="map"
href="https://www.google.com/maps/search/?api=1&query=Київ,+вулиця+Павлівська,+26/41"
target="_blank">
вул. Павлівська, 26/41, Київ
</a>

<!-- QR-код -->
<a class="qr" href="https://tolstov.com.ua" title="Відкрити сайт"></a>

</div>

</body>
</html>
